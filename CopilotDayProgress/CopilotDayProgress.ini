[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=1
SkinWidth=600
SkinHeight=32
AlwaysOnTop=2
KeepOnScreen=1
Draggable=0

[Variables]
UsageAccount=daniele-quero_Alten

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,600,32 | Fill Color 0,0,0,1 | StrokeWidth 0
ToolTipText=Click to refresh
LeftMouseUpAction=[!UpdateMeasure MeasureDayProgress][!UpdateMeter MeterDayProgress][!CommandMeasure MeasureCopilotUsage "Run"][!Redraw]

[MeasureDayProgress]
Measure=Script
ScriptFile=#CURRENTPATH#CopilotDayProgress.lua
UpdateDivider=1
DynamicVariables=1

[MeasureCopilotUsage]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#CURRENTPATH#GetCopilotUsage.ps1" -UsageAccount "#UsageAccount#"
State=Hide
OutputType=ANSI
UpdateDivider=1
FinishAction=[!UpdateMeasure MeasureCopilotCompare][!UpdateMeter MeterCopilotUsage][!Redraw]
DynamicVariables=1

[MeasureCopilotUpdater]
Measure=Calc
Formula=1
UpdateDivider=30
OnRefreshAction=[!CommandMeasure MeasureCopilotUsage "Run"]
OnUpdateAction=[!CommandMeasure MeasureCopilotUsage "Run"]

[MeasureCopilotCompare]
Measure=Calc
Formula=([MeasureCopilotUsage] > [MeasureDayProgress]) ? 1 : 0
IfConditionMode=1
IfTrueAction=[!SetOption MeterCopilotUsage FontColor "255,70,70,255"]
IfFalseAction=[!SetOption MeterCopilotUsage FontColor "70,255,120,255"]
UpdateDivider=1
DynamicVariables=1

[MeterDayProgress]
Meter=String
MeasureName=MeasureDayProgress
X=8
Y=7
W=72
H=25
Text=Day %1% - 
FontColor=255,255,255,255
FontFace=Segoe UI
FontSize=14
StringAlign=Left
AntiAlias=1
ToolTipText=Click to refresh
LeftMouseUpAction=[!UpdateMeasure MeasureDayProgress][!UpdateMeter MeterDayProgress][!CommandMeasure MeasureCopilotUsage "Run"][!Redraw]

[MeterCopilotUsage]
Meter=String
MeasureName=MeasureCopilotUsage
X=98
Y=7
W=42
H=25
Text=%1% Usage
FontColor=70,255,120,255
FontFace=Segoe UI
FontSize=14
StringAlign=Left
AntiAlias=1
ToolTipText=Click to refresh
LeftMouseUpAction=[!UpdateMeasure MeasureDayProgress][!UpdateMeter MeterDayProgress][!CommandMeasure MeasureCopilotUsage "Run"][!Redraw]


[RainmeterMeta]
Version=1.0
Description=Day progression and GitHub Copilot usage widget
