[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=0
SkinWidth=520
SkinHeight=32
AlwaysOnTop=2
KeepOnScreen=1

[Variables]
UsageAccount=daniele-quero_Alten

[MeasureDayProgress]
Measure=Script
ScriptFile=#CURRENTPATH#CopilotDayProgress.lua
UpdateDivider=1
DynamicVariables=1

[MeasureCopilotUsage]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#CURRENTPATH#GetCopilotUsage.ps1" -UsageAccount "#UsageAccount#"
State=Hide
OutputType=ANSI
UpdateDivider=1
FinishAction=[!UpdateMeasure MeasureCopilotCompare][!UpdateMeter MeterCopilotUsage][!Redraw]
DynamicVariables=1

[MeasureCopilotUpdater]
Measure=Calc
Formula=1
UpdateDivider=30
OnRefreshAction=[!CommandMeasure MeasureCopilotUsage "Run"]
OnUpdateAction=[!CommandMeasure MeasureCopilotUsage "Run"]

[MeasureCopilotCompare]
Measure=Calc
Formula=([MeasureCopilotUsage] > [MeasureDayProgress]) ? 1 : 0
IfConditionMode=1
IfTrueAction=[!SetOption MeterCopilotUsage FontColor "255,70,70,255"]
IfFalseAction=[!SetOption MeterCopilotUsage FontColor "70,255,120,255"]
UpdateDivider=1
DynamicVariables=1

[MeterDayProgress]
Meter=String
MeasureName=MeasureDayProgress
X=8
Y=7
W=220
H=25
Text=Day Progression %1%
FontColor=255,255,255,255
FontFace=Segoe UI
FontSize=14
StringAlign=Left
AntiAlias=1

[MeterCopilotUsage]
Meter=String
MeasureName=MeasureCopilotUsage
X=228
Y=7
W=284
H=25
Text= -  %1% Copilot Usage
FontColor=70,255,120,255
FontFace=Segoe UI
FontSize=14
StringAlign=Left
AntiAlias=1
ClipString=1

[RainmeterMeta]
Version=1.0
Description=Day progression and GitHub Copilot usage widget
