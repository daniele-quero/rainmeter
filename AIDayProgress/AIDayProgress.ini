[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=1
SkinWidth=480
SkinHeight=32
AlwaysOnTop=2
KeepOnScreen=1
Draggable=0
MouseActionCursor=0

[Variables]
UsageAccount=daniele-quero_Alten
UsageCreditLimit=35000
CopilotColor=31,156,240,255
ClaudeColor=217,119,87,255
AlertColor=255,70,70,255
RefreshAction=[!UpdateMeasure MeasureDayProgress][!UpdateMeter MeterDayProgress][!CommandMeasure MeasureCopilotUsage "Run"][!CommandMeasure MeasureClaudeUsage "Run"][!Redraw]

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,([MeterClaudeUsage:X]+[MeterClaudeUsage:W]+8),32 | Fill Color 0,0,0,1 | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=#RefreshAction#

[MeasureDayProgress]
Measure=Script
ScriptFile=#CURRENTPATH#AIDayProgress.lua
UpdateDivider=1
DynamicVariables=1

[MeasureCopilotUsage]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#CURRENTPATH#GetCopilotUsage.ps1" -UsageAccount "#UsageAccount#" -CreditLimit "#UsageCreditLimit#"
State=Hide
OutputType=ANSI
UpdateDivider=1
FinishAction=[!UpdateMeasure MeasureCopilotCompare][!UpdateMeasure MeasureCopilotDisplay][!UpdateMeter MeterCopilotUsage][!UpdateMeter MeterSeparator2][!UpdateMeter MeterClaudeUsage][!UpdateMeter MeterBackground][!Redraw]
DynamicVariables=1

[MeasureClaudeUsage]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#CURRENTPATH#GetClaudeUsage.ps1"
State=Hide
OutputType=ANSI
UpdateDivider=1
FinishAction=[!UpdateMeasure MeasureClaudeCompare][!UpdateMeasure MeasureClaudeDisplay][!UpdateMeter MeterClaudeUsage][!UpdateMeter MeterBackground][!Redraw]
DynamicVariables=1

[MeasureCopilotDisplay]
Measure=String
String=[MeasureCopilotUsage]
RegExpSubstitute=1
Substitute="^(\d+(\.\d+)?)$":"\1%","^Unable[\s\S]*$":"n/a"
UpdateDivider=1
DynamicVariables=1

[MeasureClaudeDisplay]
Measure=String
String=[MeasureClaudeUsage]
RegExpSubstitute=1
Substitute="^(\d+(\.\d+)?)$":"\1%","^Unable[\s\S]*$":"n/a"
UpdateDivider=1
DynamicVariables=1

[MeasureCopilotUpdater]
Measure=Calc
Formula=1
UpdateDivider=15
OnRefreshAction=[!CommandMeasure MeasureCopilotUsage "Run"]
OnUpdateAction=[!CommandMeasure MeasureCopilotUsage "Run"]

[MeasureClaudeUpdater]
Measure=Calc
Formula=1
UpdateDivider=60
OnRefreshAction=[!CommandMeasure MeasureClaudeUsage "Run"]
OnUpdateAction=[!CommandMeasure MeasureClaudeUsage "Run"]

[MeasureCopilotCompare]
Measure=Calc
Formula=([MeasureCopilotUsage] > [MeasureDayProgress]) ? 1 : 0
IfCondition=MeasureCopilotCompare = 1
IfTrueAction=[!SetOption MeterCopilotUsage FontColor "#AlertColor#"]
IfFalseAction=[!SetOption MeterCopilotUsage FontColor "#CopilotColor#"]
UpdateDivider=1
DynamicVariables=1

[MeasureClaudeCompare]
Measure=Calc
Formula=([MeasureClaudeUsage] > [MeasureDayProgress]) ? 1 : 0
IfCondition=MeasureClaudeCompare = 1
IfTrueAction=[!SetOption MeterClaudeUsage FontColor "#AlertColor#"]
IfFalseAction=[!SetOption MeterClaudeUsage FontColor "#ClaudeColor#"]
UpdateDivider=1
DynamicVariables=1

[StyleText]
FontColor=255,255,255,255
FontFace=Segoe UI
FontSize=14
StringAlign=Left
AntiAlias=1
Y=7
LeftMouseUpAction=#RefreshAction#

[MeterDayProgress]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDayProgress
X=8
Text=Day %1%

[MeterSeparator1]
Meter=String
MeterStyle=StyleText
X=12R
Text=-

[MeterCopilotUsage]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureCopilotDisplay
X=12R
Text=Copilot %1
FontColor=#CopilotColor#

[MeterSeparator2]
Meter=String
MeterStyle=StyleText
X=12R
Text=-

[MeterClaudeUsage]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureClaudeDisplay
X=12R
Text=Claude %1
FontColor=#ClaudeColor#

[RainmeterMeta]
Version=1.1
Description=Day progression and AI usage (GitHub Copilot, Claude) widget
